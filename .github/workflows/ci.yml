name: CI
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install hledger (used only by the engine parity tests, which skip without it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y hledger
      - run: npm ci
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t pennystead:ci .
      - name: Refuses to start on the network without a password
        run: |
          if docker run --rm pennystead:ci; then echo "should have refused"; exit 1; fi
      - name: Runs with a password, and the API is locked
        run: |
          docker run -d --name h -p 127.0.0.1:3456:3456 -e PENNYSTEAD_PASSWORD=ci-password-123 pennystead:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3456/api/ping && break; sleep 1; done
          curl -sf http://localhost:3456/api/ping
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3456/api/state)" = 401
          test "$(docker inspect --format '{{.State.Health.Status}}' h)" != "unhealthy"
          docker logs h
