<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pennystead · Sign in</title>
<link rel="icon" href="/favicon.svg">
<style>
:root{color-scheme:dark;--bg:#0c0d0e;--card:#151618;--line:#25272b;--text:#f0efec;--muted:#8a8b90;--accent:#3987e5;--bad:#f0645f}
@media (prefers-color-scheme:light){:root{color-scheme:light;--bg:#f4f4f2;--card:#fcfcfb;--line:#e2e1dc;--text:#0b0b0b;--muted:#7b7a76;--accent:#2a78d6;--bad:#c93a35}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
form{width:min(360px,92vw);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 16px;color:var(--muted);font-size:13px}
input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit}
input:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent)}
button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.6}
#err{color:var(--bad);font-size:13px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form id="f">
  <h1>Pennystead</h1><p>Enter your password to continue.</p>
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus required>
  <button id="go">Sign in</button><div id="err" role="alert"></div>
</form>
<script src="/login.js"></script>
</body>
</html>
