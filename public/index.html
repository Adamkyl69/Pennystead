<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pennystead</title>
<style>
:root{color-scheme:dark;
  --bg:#0c0d0e;--side:#101113;--card:#151618;--card2:#1a1b1e;--line:#25272b;--text:#f0efec;--text2:#c3c2b7;--muted:#8a8b90;--accent:#3987e5;
  --good:#4cc38a;--bad:#f0645f;--warn:#e0a030;--surface:#151618;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#2f9e2f;--s7:#9085e9;--s8:#e66767;--other:#6b6d73}
@media (prefers-color-scheme:light){:root{color-scheme:light;
  --bg:#f4f4f2;--side:#fbfbfa;--card:#fcfcfb;--card2:#f2f2ef;--line:#e2e1dc;--text:#0b0b0b;--text2:#52514e;--muted:#7b7a76;--accent:#2a78d6;
  --good:#12805a;--bad:#c93a35;--warn:#a86a00;--surface:#fcfcfb;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--other:#a5a49f}}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;display:flex}
button,input,select{font:inherit;color:inherit}
aside{width:200px;flex:none;background:var(--side);border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:8px;align-items:center;font-weight:600;padding:4px 8px 14px}
.nav{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--text2);text-decoration:none;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--card2)}.nav.on{background:var(--card2);color:var(--text)}
.nav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav .badge{margin-left:auto;font-size:11px;color:var(--muted)}
.nav.primary{background:var(--text);color:var(--bg);font-weight:500;margin-bottom:10px}.nav.primary:hover{opacity:.9}.nav.primary:disabled{opacity:.5;cursor:default}
.grp{font-size:11px;color:var(--muted);padding:14px 10px 4px}
.foot{font-size:11px;color:var(--muted);padding:8px 10px;display:flex;gap:6px;align-items:center}.foot:first-of-type{}.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}.dot.off{background:var(--muted)}
.wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:44px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;background:var(--bg);z-index:5}
.top h1{font-size:14px;font-weight:500;margin:0}.icon-btn{background:none;border:0;color:var(--muted);cursor:pointer;padding:4px;display:none}
#page{padding:16px;max-width:1280px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:15px;font-weight:600;margin:0}.card .sub{color:var(--muted);font-size:12px;margin:2px 0 12px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px}.kpis .card{margin:0;padding:14px 16px}
.kpi .l{color:var(--text2);font-size:12px}.kpi .v{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin:4px 0 8px;letter-spacing:-.01em}
.kpi .d{font-size:12px;font-weight:500}.kpi .d2{font-size:12px;color:var(--muted)}
.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--text2);white-space:nowrap;display:inline-block}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--card)}
.seg button{background:none;border:0;padding:5px 11px;cursor:pointer;color:var(--text2);font-size:13px;border-right:1px solid var(--line)}.seg button:last-child{border:0}
.seg button.on{background:var(--card2);color:var(--text)}
.btn{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--text)}.btn:hover{background:var(--card2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}a.btn{display:inline-block;text-decoration:none}.btn.danger{color:var(--bad)}.btn.sm{padding:2px 8px;font-size:12px}.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=number],input[type=date],input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13px;min-width:0}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.crumb{color:var(--muted);font-size:13px;margin-bottom:12px}.crumb a{color:var(--text2);cursor:pointer}.crumb a:hover{color:var(--text)}
table{width:100%;border-collapse:collapse}th{color:var(--muted);font-weight:500;font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto;margin-bottom:16px}.tbl table{min-width:640px}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:8px;vertical-align:baseline}
.track{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;min-width:90px;position:relative}.pace{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.65}.fill{height:100%;border-radius:3px;background:var(--accent)}.fill.over{background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--text2);margin-top:8px}
.chart{position:relative;width:100%}.chart svg{display:block;overflow:visible}
text{fill:var(--muted);font-size:11px}
#tip{position:fixed;pointer-events:none;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;z-index:50;display:none;box-shadow:0 6px 24px #0006;min-width:140px}
#tip b{font-weight:600}#tip .r{display:flex;justify-content:space-between;gap:16px;color:var(--text2)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 14px;margin-bottom:12px;font-size:13px;color:var(--text2)}
.banner a{color:var(--text);cursor:pointer;font-weight:500}
.tabs{display:flex;justify-content:space-between;margin-bottom:10px;align-items:center}
.empty{color:var(--muted);padding:12px 0}.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-items:end}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}.form label.chk{flex-direction:row;align-items:center;gap:6px;padding-bottom:6px}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px;white-space:nowrap}
.an{padding:10px 0;border-bottom:1px solid var(--line)}.an:last-child{border:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.right{margin-left:auto}
@media (max-width:820px){aside{position:fixed;z-index:20;transform:translateX(-100%);transition:.15s}aside.open{transform:none}.icon-btn{display:block}}
</style>
</head>
<body>
<aside id="side"></aside>
<div class="wrap">
  <div class="top"><button class="icon-btn" id="burger" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><h1 id="title"></h1><span class="right row" id="topActions"></span></div>
  <div id="page"><p class="muted">Loading…</p></div>
</div>
<div id="tip"></div>
<script src="/app.js"></script>
<script src="/pages.js"></script>
</body>
</html>
